name: Django CI Minimal

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # On utilise des versions stables et récentes de Python
        python-version: ["3.10", "3.11"]

    steps:
    # 1. Télécharger le code du dépôt sur le serveur d'évaluation
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Installer la bonne version de Python
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # 3. Installer Poetry proprement
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    # 4. Mettre en cache les dépendances pour accélérer les futurs lancements
    - name: Cache Poetry virtualenv
      uses: actions/cache@v4
      id: cache-deps
      with:
        path: .venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

    # 5. Installer les dépendances uniquement si le cache n'a pas été trouvé
    - name: Install Dependencies
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    # 6. Exécuter les tests Django à la racine
    - name: Run Tests
      run: poetry run python manage.py test
